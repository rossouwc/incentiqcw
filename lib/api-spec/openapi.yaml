openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Incentiq Commission Wallet Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: tenants
    description: Tenant/company management
  - name: users
    description: User management
  - name: deals
    description: Deal management
  - name: wallet
    description: Wallet operations
  - name: payouts
    description: Payout requests
  - name: commission-rules
    description: Commission rule management
  - name: approvals
    description: Approval workflows
  - name: reports
    description: Analytics and reporting
  - name: notifications
    description: Notifications
  - name: audit
    description: Audit logs

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ───────────────────────────────────────────
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new company and admin user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── TENANT ─────────────────────────────────────────
  /tenant:
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Get current tenant info
      responses:
        "200":
          description: Tenant info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
    patch:
      operationId: updateTenant
      tags: [tenants]
      summary: Update tenant settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  # ─── USERS ───────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users in tenant
      parameters:
        - name: role
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Users list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Invite a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── DEALS ───────────────────────────────────────────
  /deals:
    get:
      operationId: listDeals
      tags: [deals]
      summary: List deals
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: dealType
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Deals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealsPage"
    post:
      operationId: createDeal
      tags: [deals]
      summary: Create a deal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"

  /deals/{dealId}/submit:
    post:
      operationId: submitDeal
      tags: [deals]
      summary: Submit a deal for approval
      parameters:
        - name: dealId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deal submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"

  /deals/{dealId}:
    get:
      operationId: getDeal
      tags: [deals]
      summary: Get a deal
      parameters:
        - name: dealId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
    patch:
      operationId: updateDeal
      tags: [deals]
      summary: Update a deal
      parameters:
        - name: dealId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
    delete:
      operationId: deleteDeal
      tags: [deals]
      summary: Delete a deal
      parameters:
        - name: dealId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── WALLET ──────────────────────────────────────────
  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get wallet balances for current user
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"

  /wallet/transactions:
    get:
      operationId: listTransactions
      tags: [wallet]
      summary: List own wallet transactions (paginated)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Transaction page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"

  /wallet/deals:
    get:
      operationId: listWalletDeals
      tags: [wallet]
      summary: List deals linked to the current user's wallet
      responses:
        "200":
          description: Deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WalletDeal"

  /wallet/users:
    get:
      operationId: listTeamWallets
      tags: [wallet]
      summary: List all wallets in the tenant (manager/admin/finance/executive)
      responses:
        "200":
          description: Team wallets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Wallet"

  /wallet/users/{userId}:
    get:
      operationId: getUserWallet
      tags: [wallet]
      summary: Get a specific user's wallet
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"

  /wallet/users/{userId}/transactions:
    get:
      operationId: listWalletUserTransactions
      tags: [wallet]
      summary: List a specific user's wallet transactions
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaction page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionPage"

  # ─── PAYOUTS ─────────────────────────────────────────
  /payouts:
    get:
      operationId: listPayouts
      tags: [payouts]
      summary: List payout requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Payouts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayoutRequest"
    post:
      operationId: createPayout
      tags: [payouts]
      summary: Request a payout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutRequest"

  /payouts/export:
    get:
      operationId: exportPayouts
      tags: [payouts]
      summary: Export approved payouts data
      parameters:
        - name: month
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Export rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayoutExportRow"

  /payouts/{payoutId}:
    get:
      operationId: getPayout
      tags: [payouts]
      summary: Get a payout request
      parameters:
        - name: payoutId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Payout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutRequest"
    patch:
      operationId: updatePayoutStatus
      tags: [payouts]
      summary: Approve or reject a payout (Finance)
      parameters:
        - name: payoutId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutRequest"

  /payouts/{payoutId}/mark-paid:
    post:
      operationId: markPayoutPaid
      tags: [payouts]
      summary: Mark approved payout as paid (Payroll)
      parameters:
        - name: payoutId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marked paid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutRequest"

  # ─── COMMISSION RULES ────────────────────────────────
  /commission-rules:
    get:
      operationId: listCommissionRules
      tags: [commission-rules]
      summary: List commission rules
      responses:
        "200":
          description: Rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommissionRule"
    post:
      operationId: createCommissionRule
      tags: [commission-rules]
      summary: Create a commission rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionRuleInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionRule"

  /commission-rules/{ruleId}:
    patch:
      operationId: updateCommissionRule
      tags: [commission-rules]
      summary: Update a commission rule
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionRuleUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionRule"
    delete:
      operationId: deleteCommissionRule
      tags: [commission-rules]
      summary: Delete a commission rule
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── COMMISSION RULE GROUPS ──────────────────────────
  /commission-rule-groups:
    get:
      operationId: listCommissionRuleGroups
      tags: [commission-rule-groups]
      summary: List commission rule groups
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommissionRuleGroup"
    post:
      operationId: createCommissionRuleGroup
      tags: [commission-rule-groups]
      summary: Create a commission rule group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionRuleGroupInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionRuleGroup"

  /commission-rule-groups/{groupId}:
    patch:
      operationId: updateCommissionRuleGroup
      tags: [commission-rule-groups]
      summary: Update a commission rule group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionRuleGroupUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionRuleGroup"
    delete:
      operationId: deleteCommissionRuleGroup
      tags: [commission-rule-groups]
      summary: Delete a commission rule group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  # ─── APPROVALS ───────────────────────────────────────
  /approvals:
    get:
      operationId: listApprovals
      tags: [approvals]
      summary: List pending approvals
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Approvals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"

  /approvals/deal/{dealId}:
    get:
      operationId: getDealApprovals
      tags: [approvals]
      summary: Get approval chain for a deal
      parameters:
        - name: dealId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approval chain
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Approval"

  /approvals/{approvalId}/action:
    post:
      operationId: actionApproval
      tags: [approvals]
      summary: Approve, reject or request changes
      parameters:
        - name: approvalId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalAction"
      responses:
        "200":
          description: Actioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Approval"

  # ─── APPROVAL CONFIG ─────────────────────────────────────
  /approval-configs:
    get:
      operationId: listApprovalConfigs
      tags: [approvals]
      summary: List approval workflow steps for this tenant
      responses:
        "200":
          description: Approval configs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApprovalConfig"
    post:
      operationId: createApprovalConfig
      tags: [approvals]
      summary: Create a new approval workflow step
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalConfigInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalConfig"

  /approval-configs/{configId}:
    patch:
      operationId: updateApprovalConfig
      tags: [approvals]
      summary: Update an approval workflow step
      parameters:
        - name: configId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApprovalConfigUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApprovalConfig"
    delete:
      operationId: deleteApprovalConfig
      tags: [approvals]
      summary: Delete an approval workflow step
      parameters:
        - name: configId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # ─── DASHBOARD SUMMARY (wow endpoints) ───────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [reports]
      summary: Dashboard wallet summary totals
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/commission-trend:
    get:
      operationId: getCommissionTrend
      tags: [reports]
      summary: Commission trend over last 6 months
      responses:
        "200":
          description: Trend data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrendPoint"

  /dashboard/commission-by-type:
    get:
      operationId: getCommissionByType
      tags: [reports]
      summary: Commission breakdown by deal type
      responses:
        "200":
          description: Breakdown
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommissionByType"

  /dashboard/payout-summary:
    get:
      operationId: getPayoutSummary
      tags: [reports]
      summary: Payout summary with tax estimate
      responses:
        "200":
          description: Payout summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutSummary"

  /dashboard/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [reports]
      summary: Recent activity feed
      responses:
        "200":
          description: Activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /dashboard/my-tasks:
    get:
      operationId: getMyTasks
      tags: [reports]
      summary: My pending task counts
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyTasks"

  # ─── REPORTS ─────────────────────────────────────────
  /reports/deals:
    get:
      operationId: getDealsReport
      tags: [reports]
      summary: Deals performance report
      parameters:
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealsReport"

  # ─── NOTIFICATIONS ───────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
      tags: [notifications]
      summary: List notifications for current user
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{notificationId}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      summary: Mark notification as read
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  # ─── AUDIT LOGS ──────────────────────────────────────
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit]
      summary: List audit logs for tenant
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # ─── AUTH SCHEMAS ────────────────────────────────────
    RegisterInput:
      type: object
      required: [companyName, email, password, firstName, lastName]
      properties:
        companyName:
          type: string
        email:
          type: string
        password:
          type: string
        firstName:
          type: string
        lastName:
          type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    # ─── TENANT ──────────────────────────────────────────
    Tenant:
      type: object
      required: [id, name, slug, currency, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        currency:
          type: string
        logoUrl:
          type: ["string", "null"]
        taxRate:
          type: number
        createdAt:
          type: string

    TenantUpdate:
      type: object
      properties:
        name:
          type: string
        currency:
          type: string
        taxRate:
          type: number
        logoUrl:
          type: string

    # ─── USER ─────────────────────────────────────────────
    User:
